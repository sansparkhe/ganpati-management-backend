[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
filterwarnings = [
    # SQLAlchemy warns that SQLite has no native DECIMAL type. Only the test
    # suite uses SQLite; production runs on PostgreSQL NUMERIC(12,2).
    "ignore::sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() in defaults is idiomatic
    "UP042",  # str+Enum is deliberate: it serialises as a plain string everywhere
]
